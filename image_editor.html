<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片编辑器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.topbar{background:#14142b;border-bottom:1px solid #2a2a4a;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;color:#7b8cff;margin-right:8px;letter-spacing:1px}
.sep{width:1px;height:24px;background:#2a2a4a;margin:0 4px}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;transition:all .15s}
.btn:disabled{color:#555;background:#1a1a2e!important;opacity:.5;cursor:default}
.btn-p{background:#2952e0}.btn-g{background:#444}.btn-gr{background:#1a8a3f}.btn-r{background:#cc2233}
.btn:not(:disabled):hover{filter:brightness(1.2)}
.btn-sm{padding:4px 10px;font-size:12px}
.zoom-bar{display:flex;align-items:center;gap:6px;margin-left:8px}
.zoom-bar span{font-size:12px;color:#8888cc;min-width:42px;text-align:center}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:#12122a;border-right:1px solid #2a2a4a;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#6670aa;margin-bottom:6px}
.tool-btns{display:flex;gap:4px}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600;color:#888;background:#1a1a3a;transition:all .15s;min-width:44px}
.tbtn.on{color:#fff;background:#2952e0}
.tbtn:hover:not(.on){background:#22224a}
.swatches{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.sw{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#7b8cff}
.crow{display:flex;align-items:center;gap:6px;margin-top:4px}
.crow input[type="color"]{width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0}
.chex{font-size:12px;color:#888}
.cbl{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.rl{font-size:12px;color:#aaa;margin-top:4px}
input[type="range"]{width:100%;accent-color:#7b8cff}
.tinput{background:#1a1a3a;border:1px solid #2a2a5a;border-radius:6px;padding:6px 8px;color:#e0e0e0;font-size:13px;outline:none;width:100%}
.tinput:focus{border-color:#7b8cff}
select.tinput{cursor:pointer}
.tip{padding:8px;background:#1a1a3a;border-radius:6px;font-size:12px;color:#8888cc;line-height:1.5}
.canvas-area{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px;background:#0a0a18}
.cwrap{position:relative;display:inline-block}
canvas{border-radius:4px;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.tovl{position:absolute;z-index:10}
.tovl textarea{border:1px dashed #7b8cff;background:rgba(0,0,0,.4);outline:none;padding:2px 4px;min-width:60px;resize:both;line-height:1.2}
#fileInput{display:none}
.prop-section{display:flex;flex-direction:column;gap:4px}
.prop-section+.prop-section{margin-top:8px;padding-top:8px;border-top:1px solid #1e1e3e}
.prop-row{display:flex;align-items:center;gap:8px}
.prop-label{font-size:12px;color:#aaa;min-width:45px;flex-shrink:0}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">IMG EDITOR</span>
  <button class="btn btn-p" onclick="$('fileInput').click()">打开图片</button>
  <input type="file" id="fileInput" accept="image/*" onchange="openFile(event)">
  <div class="sep"></div>
  <button class="btn btn-g" id="btnUndo" disabled onclick="undo()">撤销</button>
  <button class="btn btn-g" id="btnClear" disabled onclick="clearAll()">清除全部</button>
  <div class="sep"></div>
  <div class="zoom-bar">
    <button class="btn btn-g btn-sm" onclick="zoomBy(-0.1)">−</button>
    <span id="zoomLbl">100%</span>
    <button class="btn btn-g btn-sm" onclick="zoomBy(0.1)">+</button>
    <button class="btn btn-g btn-sm" onclick="zoomFit()">适应</button>
  </div>
  <div style="flex:1"></div>
  <button class="btn btn-gr" id="btnExport" disabled onclick="doExport()">导出 PNG</button>
</div>

<div class="main">
  <div class="sidebar">
    <!-- Tools -->
    <div>
      <div class="stitle">绘制工具</div>
      <div class="tool-btns">
        <button class="tbtn on" id="t_select" onclick="setTool('select')">
          <svg width="16" height="16" viewBox="0 0 18 18"><path d="M4 2l10 7-5 1-2 5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>选择
        </button>
        <button class="tbtn" id="t_rect" onclick="setTool('rect')">
          <svg width="16" height="16" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>方框
        </button>
        <button class="tbtn" id="t_line" onclick="setTool('line')">
          <svg width="16" height="16" viewBox="0 0 18 18"><line x1="3" y1="15" x2="15" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>直线
        </button>
        <button class="tbtn" id="t_text" onclick="setTool('text')">
          <svg width="16" height="16" viewBox="0 0 18 18"><text x="3" y="14" font-size="14" fill="currentColor" font-weight="700">T</text></svg>文字
        </button>
      </div>
    </div>

    <!-- Properties Panel (shown when element selected) -->
    <div id="propPanel" style="display:none">
      <div class="stitle">属性编辑 <span id="propType" style="color:#7b8cff"></span></div>
      <div id="propContent"></div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn btn-r" style="flex:1;font-size:12px;padding:5px" onclick="delSel()">删除元素</button>
      </div>
    </div>

    <!-- Hint when nothing selected -->
    <div id="hintPanel">
      <div class="tip" id="hintText">选择工具后在画布上绘制。<br>创建后切到「选择」工具，点击元素即可编辑属性。</div>
    </div>
  </div>

  <div class="canvas-area" id="canvasArea">
    <div class="cwrap" id="canvasWrap">
      <canvas id="canvas" width="800" height="500"></canvas>
      <div class="tovl" id="textOverlay" style="display:none">
        <textarea id="textArea"></textarea>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const COLORS = ['#ff4444','#ff8800','#ffdd00','#44cc44','#2299ff','#8844ff','#ffffff','#000000'];

let img=null, baseScale=1, zoom=1, tool='select';
let els=[], undoStack=[], selIdx=-1;
let drawing=false, startP=null, curPreview=null;
let dragging=false, dragStart=null, dragOrig=null, dragUndoSaved=false;
let shiftKey=false;

document.addEventListener('keydown',e=>{if(e.key==='Shift')shiftKey=true});
document.addEventListener('keyup',e=>{if(e.key==='Shift')shiftKey=false});

function sc(){return baseScale*zoom}

// ---- Placeholder ----
function drawPH(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#555';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('点击「打开图片」加载文件',canvas.width/2,canvas.height/2);ctx.textAlign='start'}
drawPH();

// ---- Tools ----
function setTool(t){
  tool=t;
  ['select','rect','line','text'].forEach(id=>{$('t_'+id).className='tbtn'+(t===id?' on':'')});
  $('textOverlay').style.display='none';
  canvas.style.cursor=t==='rect'||t==='line'?'crosshair':t==='text'?'text':'default';
  if(t!=='select'){selIdx=-1;refreshProps();redraw()}
  const hints={select:'点击元素选中，拖拽移动位置。\n选中后左侧编辑所有属性。',rect:'在画布上拖拽绘制方框。\n创建后自动选中，可立即编辑属性。',line:'在画布上拖拽绘制直线。\n按住 Shift 锁定角度。',text:'在画布上点击放置文字。\nEnter 确认，Esc 取消。'};
  $('hintText').innerText=hints[t]||'';
}

// ---- Zoom ----
function applyZoom(){const s=sc();canvas.style.width=(canvas.width*s)+'px';canvas.style.height=(canvas.height*s)+'px';$('zoomLbl').textContent=Math.round(zoom*100)+'%'}
function zoomBy(d){zoom=Math.max(.1,Math.min(5,zoom+d));applyZoom()}
function zoomFit(){if(!img){zoom=1;applyZoom();return}const a=$('canvasArea');zoom=Math.min((a.clientWidth-40)/canvas.width,(a.clientHeight-40)/canvas.height)/baseScale;zoom=Math.max(.1,Math.min(5,zoom));applyZoom()}
$('canvasArea').addEventListener('wheel',e=>{if(!img)return;e.preventDefault();zoomBy(e.deltaY>0?-.1:.1)},{passive:false});

// ---- File ----
function openFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{const i=new Image();i.onload=()=>{img=i;const a=$('canvasArea');baseScale=1;if(i.naturalWidth>a.clientWidth-40)baseScale=(a.clientWidth-40)/i.naturalWidth;if(i.naturalHeight*baseScale>a.clientHeight-40)baseScale=(a.clientHeight-40)/i.naturalHeight;canvas.width=i.naturalWidth;canvas.height=i.naturalHeight;zoom=1;applyZoom();els=[];undoStack=[];selIdx=-1;updBtn();refreshProps();redraw()};i.src=ev.target.result};r.readAsDataURL(f);
}

function updBtn(){$('btnUndo').disabled=undoStack.length===0;$('btnClear').disabled=els.length===0;$('btnExport').disabled=!img}
function pushUndo(){undoStack.push(JSON.parse(JSON.stringify(els)))}
function coords(e){const r=canvas.getBoundingClientRect(),s=sc();return{x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s}}

// ---- Bounds & Hit Test ----
function getBounds(el){
  if(el.type==='rect')return{cx:el.x+el.w/2,cy:el.y+el.h/2,hw:el.w/2,hh:el.h/2};
  if(el.type==='text'){ctx.save();ctx.font=el.fontSize+'px '+el.fontFamily;const ls=el.text.split('\n');let mw=0;ls.forEach(l=>{const m=ctx.measureText(l);if(m.width>mw)mw=m.width});ctx.restore();const h=ls.length*el.fontSize*1.2;return{cx:el.x+mw/2,cy:el.y+h/2,hw:mw/2,hh:h/2}}
  if(el.type==='line'){const cx=(el.x1+el.x2)/2,cy=(el.y1+el.y2)/2;return{cx,cy,hw:Math.abs(el.x2-el.x1)/2+10,hh:Math.abs(el.y2-el.y1)/2+10}}
  return null;
}
function hitLine(el,px,py){const dx=el.x2-el.x1,dy=el.y2-el.y1,l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(px-el.x1,py-el.y1)<10;let t=((px-el.x1)*dx+(py-el.y1)*dy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(el.x1+t*dx),py-(el.y1+t*dy))<Math.max(el.lineWidth/2+6,8)}
function hit(el,px,py){
  if(el.type==='line')return hitLine(el,px,py);
  const b=getBounds(el);if(!b)return false;const rot=(el.rotation||0)*Math.PI/180;const dx=px-b.cx,dy=py-b.cy;const c=Math.cos(-rot),s=Math.sin(-rot);return Math.abs(dx*c-dy*s)<=b.hw+8&&Math.abs(dx*s+dy*c)<=b.hh+8;
}

// ---- Draw ----
function drawEl(el,hl){
  const rot=(el.rotation||0)*Math.PI/180;
  if(el.type==='line'){
    ctx.save();if(rot){const cx=(el.x1+el.x2)/2,cy=(el.y1+el.y2)/2;ctx.translate(cx,cy);ctx.rotate(rot);ctx.translate(-cx,-cy)}
    ctx.strokeStyle=el.lineColor;ctx.lineWidth=el.lineWidth;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(el.x1,el.y1);ctx.lineTo(el.x2,el.y2);ctx.stroke();
    if(hl){ctx.strokeStyle='#7b8cff';ctx.lineWidth=2;ctx.setLineDash([6,4]);const p=8,x1=Math.min(el.x1,el.x2)-p,y1=Math.min(el.y1,el.y2)-p;ctx.strokeRect(x1,y1,Math.max(el.x1,el.x2)+p-x1,Math.max(el.y1,el.y2)+p-y1);ctx.setLineDash([]);ctx.fillStyle='#7b8cff';[[el.x1,el.y1],[el.x2,el.y2]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()})}
    ctx.restore();return;
  }
  const b=getBounds(el);if(!b)return;
  ctx.save();ctx.translate(b.cx,b.cy);ctx.rotate(rot);
  if(el.type==='rect'){
    if(el.useFill){const r=parseInt(el.fillColor.slice(1,3),16),g=parseInt(el.fillColor.slice(3,5),16),bl=parseInt(el.fillColor.slice(5,7),16);ctx.fillStyle=`rgba(${r},${g},${bl},${el.fillOpacity/100})`;ctx.fillRect(-b.hw,-b.hh,el.w,el.h)}
    if(el.useStroke&&el.strokeWidth>0){ctx.strokeStyle=el.strokeColor;ctx.lineWidth=el.strokeWidth;ctx.strokeRect(-b.hw,-b.hh,el.w,el.h)}
  }else if(el.type==='text'){
    ctx.font=el.fontSize+'px '+el.fontFamily;ctx.fillStyle=el.textColor;ctx.textBaseline='top';
    el.text.split('\n').forEach((l,i)=>{ctx.fillText(l,-b.hw,-b.hh+i*el.fontSize*1.2)});
  }
  if(hl){ctx.strokeStyle='#7b8cff';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(-b.hw-5,-b.hh-5,b.hw*2+10,b.hh*2+10);ctx.setLineDash([]);ctx.fillStyle='#7b8cff';[[-b.hw-5,-b.hh-5],[b.hw+5,-b.hh-5],[-b.hw-5,b.hh+5],[b.hw+5,b.hh+5]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()})}
  ctx.restore();
}
function redraw(extra){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(img)ctx.drawImage(img,0,0,canvas.width,canvas.height);else{drawPH();return}
  els.forEach((el,i)=>drawEl(el,i===selIdx));
  if(extra)drawEl(extra,false);
}

// ---- Properties Panel ----
function refreshProps(){
  const pp=$('propPanel'),hp=$('hintPanel');
  if(selIdx<0||selIdx>=els.length){pp.style.display='none';hp.style.display='';return}
  pp.style.display='';hp.style.display='none';
  const el=els[selIdx];
  const names={rect:'方框',line:'直线',text:'文字'};
  $('propType').textContent='— '+names[el.type];
  const c=$('propContent');c.innerHTML='';

  // Rotation (all types)
  c.appendChild(makeSection([
    makeRow('旋转',`<span id="rv" style="color:#7b8cff;font-size:12px">${el.rotation||0}°</span>`),
    `<input type="range" min="-180" max="180" value="${el.rotation||0}" oninput="setProp('rotation',+this.value);$('rv').textContent=this.value+'°'">`
  ]));

  if(el.type==='rect'){
    // Fill
    c.appendChild(makeSection([
      `<label class="cbl"><input type="checkbox" ${el.useFill?'checked':''} onchange="setProp('useFill',this.checked)"> 启用填充</label>`,
      makeRow('颜色',colorPicker('fillColor',el.fillColor)),
      makeRow('透明度',`<input type="range" min="0" max="100" value="${el.fillOpacity}" oninput="setProp('fillOpacity',+this.value);this.nextElementSibling.textContent=this.value+'%'" style="flex:1"><span style="font-size:12px;color:#aaa;min-width:32px;text-align:right">${el.fillOpacity}%</span>`)
    ]));
    // Stroke
    c.appendChild(makeSection([
      `<label class="cbl"><input type="checkbox" ${el.useStroke?'checked':''} onchange="setProp('useStroke',this.checked)"> 启用边框</label>`,
      makeRow('颜色',colorPicker('strokeColor',el.strokeColor)),
      makeRow('粗细',`<input type="range" min="1" max="20" value="${el.strokeWidth}" oninput="setProp('strokeWidth',+this.value);this.nextElementSibling.textContent=this.value+'px'" style="flex:1"><span style="font-size:12px;color:#aaa;min-width:28px;text-align:right">${el.strokeWidth}px</span>`)
    ]));
  }

  if(el.type==='line'){
    c.appendChild(makeSection([
      makeRow('颜色',colorPicker('lineColor',el.lineColor)),
      makeRow('粗细',`<input type="range" min="1" max="30" value="${el.lineWidth}" oninput="setProp('lineWidth',+this.value);this.nextElementSibling.textContent=this.value+'px'" style="flex:1"><span style="font-size:12px;color:#aaa;min-width:28px;text-align:right">${el.lineWidth}px</span>`)
    ]));
  }

  if(el.type==='text'){
    c.appendChild(makeSection([
      makeRow('内容',`<input class="tinput" value="${escH(el.text)}" onchange="setProp('text',this.value)" style="flex:1">`),
      makeRow('颜色',colorPicker('textColor',el.textColor)),
      makeRow('字号',`<input type="range" min="10" max="120" value="${el.fontSize}" oninput="setProp('fontSize',+this.value);this.nextElementSibling.textContent=this.value+'px'" style="flex:1"><span style="font-size:12px;color:#aaa;min-width:32px;text-align:right">${el.fontSize}px</span>`),
      makeRow('字体',`<select class="tinput" onchange="setProp('fontFamily',this.value)" style="flex:1">${fontOpts(el.fontFamily)}</select>`)
    ]));
  }
}

function escH(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function fontOpts(cur){
  const fs=[['sans-serif','Sans-serif'],['serif','Serif'],['monospace','Monospace'],['Arial','Arial'],['Georgia','Georgia'],['Courier New','Courier New'],['Microsoft YaHei','微软雅黑'],['SimHei','黑体'],['SimSun','宋体'],['KaiTi','楷体']];
  return fs.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('');
}

function makeSection(items){
  const d=document.createElement('div');d.className='prop-section';
  items.forEach(it=>{if(typeof it==='string'){const w=document.createElement('div');w.innerHTML=it;d.appendChild(w.firstElementChild||w)}else d.appendChild(it)});
  return d;
}
function makeRow(label,content){
  const d=document.createElement('div');d.className='prop-row';
  d.innerHTML=`<span class="prop-label">${label}</span>`;
  if(typeof content==='string'){const w=document.createElement('div');w.style.cssText='display:flex;align-items:center;gap:6px;flex:1';w.innerHTML=content;d.appendChild(w)}
  else d.appendChild(content);
  return d;
}
function colorPicker(prop,val){
  return `<input type="color" value="${val}" oninput="setProp('${prop}',this.value)" style="width:26px;height:26px;border:none;background:none;cursor:pointer;padding:0">` +
    COLORS.map(c=>`<div class="sw${c===val?' on':''}" style="background:${c};width:18px;height:18px" onclick="setProp('${prop}','${c}');refreshProps()"></div>`).join('');
}

let _propUndoSaved=false;
function setProp(key,val){
  if(selIdx<0)return;
  if(!_propUndoSaved){pushUndo();_propUndoSaved=true;updBtn();setTimeout(()=>{_propUndoSaved=false},500)}
  els[selIdx][key]=val;
  redraw();
  // Update inline display values
  const parent=$('propContent');
  if(parent){
    const spans=parent.querySelectorAll('span');
    // Simple approach: just refresh if it's a color or checkbox change
    if(key.includes('Color')||key==='useFill'||key==='useStroke')refreshProps();
  }
}

function delSel(){if(selIdx<0)return;pushUndo();els.splice(selIdx,1);selIdx=-1;updBtn();refreshProps();redraw()}

// ---- Snap angle ----
function snap(s,e){if(!shiftKey)return e;const dx=e.x-s.x,dy=e.y-s.y,a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4),d=Math.hypot(dx,dy);return{x:s.x+Math.cos(a)*d,y:s.y+Math.sin(a)*d}}

// ---- Defaults for new elements ----
function defRect(x,y,w,h){return{type:'rect',rotation:0,x,y,w,h,fillColor:'#ff4444',fillOpacity:80,strokeColor:'#000000',strokeWidth:2,useStroke:true,useFill:true}}
function defLine(x1,y1,x2,y2){return{type:'line',rotation:0,x1,y1,x2,y2,lineColor:'#ff4444',lineWidth:3}}
function defText(x,y,text){return{type:'text',rotation:0,x,y,text,fontSize:28,textColor:'#ffffff',fontFamily:'sans-serif'}}

// ---- Mouse events ----
let dragOrigEl=null;

canvas.addEventListener('mousedown',function(e){
  if(!img)return;
  const p=coords(e);

  if(tool==='select'){
    let found=-1;
    for(let i=els.length-1;i>=0;i--){if(hit(els[i],p.x,p.y)){found=i;break}}
    selIdx=found;refreshProps();redraw();
    if(found>=0){dragging=true;dragStart=p;dragUndoSaved=false;dragOrigEl=JSON.parse(JSON.stringify(els[found]));canvas.style.cursor='grabbing'}
    return;
  }
  if(tool==='rect'||tool==='line'){drawing=true;startP=p;curPreview=null;selIdx=-1;refreshProps()}
  if(tool==='text'){selIdx=-1;refreshProps();showTI(p)}
});

canvas.addEventListener('mousemove',function(e){
  const p=coords(e);
  if(dragging&&selIdx>=0&&dragOrigEl){
    if(!dragUndoSaved){pushUndo();dragUndoSaved=true;updBtn()}
    const dx=p.x-dragStart.x,dy=p.y-dragStart.y,el=els[selIdx];
    if(el.type==='line'){el.x1=dragOrigEl.x1+dx;el.y1=dragOrigEl.y1+dy;el.x2=dragOrigEl.x2+dx;el.y2=dragOrigEl.y2+dy}
    else{el.x=dragOrigEl.x+dx;el.y=dragOrigEl.y+dy}
    redraw();return;
  }
  if(!drawing)return;
  if(tool==='rect'){curPreview=defRect(Math.min(startP.x,p.x),Math.min(startP.y,p.y),Math.abs(p.x-startP.x),Math.abs(p.y-startP.y));redraw(curPreview)}
  if(tool==='line'){const ep=snap(startP,p);curPreview=defLine(startP.x,startP.y,ep.x,ep.y);redraw(curPreview)}
});

function finishDraw(){
  if(dragging){dragging=false;dragUndoSaved=false;dragOrigEl=null;canvas.style.cursor='default';return}
  if(!drawing)return;drawing=false;
  let added=false;
  if(tool==='rect'&&curPreview&&curPreview.w>3&&curPreview.h>3){pushUndo();els.push(curPreview);added=true}
  if(tool==='line'&&curPreview){const dx=curPreview.x2-curPreview.x1,dy=curPreview.y2-curPreview.y1;if(Math.hypot(dx,dy)>3){pushUndo();els.push(curPreview);added=true}}
  if(added){selIdx=els.length-1;setTool('select');updBtn();refreshProps()}
  curPreview=null;startP=null;redraw();
}
canvas.addEventListener('mouseup',finishDraw);
canvas.addEventListener('mouseleave',finishDraw);

// ---- Text input ----
function showTI(p){
  const o=$('textOverlay'),ta=$('textArea'),s=sc();
  o.style.display='block';o.style.left=(p.x*s)+'px';o.style.top=(p.y*s)+'px';
  ta.style.fontSize=(28*s)+'px';ta.style.fontFamily='sans-serif';ta.style.color='#ffffff';
  ta.style.minHeight=(28*s+4)+'px';ta.value='文字';ta.focus();ta.select();
}
$('textArea').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitTI()}
  if(e.key==='Escape')$('textOverlay').style.display='none';
});
$('textArea').addEventListener('blur',()=>setTimeout(commitTI,100));

function commitTI(){
  const o=$('textOverlay');if(o.style.display==='none')return;
  const text=$('textArea').value.trim();o.style.display='none';if(!text)return;
  const s=sc();
  pushUndo();els.push(defText(parseFloat(o.style.left)/s,parseFloat(o.style.top)/s,text));
  selIdx=els.length-1;setTool('select');updBtn();refreshProps();redraw();
}

// ---- Undo / Clear / Export ----
function undo(){if(!undoStack.length)return;els=undoStack.pop();selIdx=-1;updBtn();refreshProps();redraw()}
function clearAll(){if(!els.length)return;pushUndo();els=[];selIdx=-1;updBtn();refreshProps();redraw()}
function doExport(){if(!img)return;const sv=selIdx;selIdx=-1;redraw();const a=document.createElement('a');a.download='edited-image.png';a.href=canvas.toDataURL('image/png');a.click();selIdx=sv;redraw()}

// ---- Keyboard good！！！----
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
  if((e.key==='Delete'||e.key==='Backspace')&&selIdx>=0){e.preventDefault();delSel()}
  if(e.key==='Escape'){selIdx=-1;refreshProps();redraw()}
});

setTool('select');
</script>
